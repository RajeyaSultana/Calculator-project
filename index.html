<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="./calculator.css">
    <script src="./calculator.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
</head>
<body>
  

<div class="calculator">

    <div class="top-bar">
        <h2>Scientific Calculator</h2>
        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <!-- <div class="history" id="history"></div> -->

    <div class="display">
        <input type="text" id="display" disabled>
    </div>

    <div class="buttons">

        <button class="special" onclick="append('sin(')">sin</button>
        <button class="special" onclick="append('cos(')">cos</button>
        <button class="special" onclick="append('tan(')">tan</button>
        <button class="special" onclick="append('sqrt(')">√</button>
        <button class="special" onclick="append('log(')">log</button>

        <button class="special" onclick="append('pi')">π</button>
        <button class="special" onclick="append('e')">e</button>
        <button class="special" onclick="append('(')">(</button>
        <button class="special" onclick="append(')')">)</button>
        <button class="special" onclick="append('!')">x!</button>

        <button class="number" onclick="append('7')">7</button>
        <button class="number" onclick="append('8')">8</button>
        <button class="number" onclick="append('9')">9</button>
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="deleteLast()">DEL</button>

        <button class="number" onclick="append('4')">4</button>
        <button class="number" onclick="append('5')">5</button>
        <button class="number" onclick="append('6')">6</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('%')">%</button>

        <button class="number" onclick="append('1')">1</button>
        <button class="number" onclick="append('2')">2</button>
        <button class="number" onclick="append('3')">3</button>
        <button class="operator" onclick="append('*')">×</button>
        <button class="operator" onclick="append('-')">−</button>

        <button class="number" onclick="append('0')">0</button>
        <button class="number" onclick="append('.')">.</button>
        <button class="operator" onclick="append('^')">^</button>
        <button class="operator" onclick="append('+')">+</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>
</div>
</body>
</html>
